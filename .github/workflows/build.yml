name: build

# Build the reworked layers against the OFFICIAL Isabelle distribution -- NOT the
# isabelle-emacs / -vsce fork used for interactive development. Runs `make ci`:
#   * the mature layers (Core, MemSem, OwickiGries, Ownership) build from clean,
#     WITHOUT quick_and_dirty -- a green run is the zero-sorry gate for them; and
#   * the in-progress Episodic spine (EventStruct, OpSem, UAF_Bug, RCU_Client) is
#     compile-checked under quick_and_dirty, since it sits on OpSem, which still
#     carries two documented open sorries (EventStruct episodic_single_iteration_window,
#     UAF_Bug uaf_excluded_fixed). RCU_Client itself adds no sorry.
# Once those sorries are discharged, fold the spine into the strict gate (see the
# `ci` target in the Makefile).
#
# The legacy MRD_C11_RCU session (now just the two generated RCU digests) is
# intentionally NOT built here; it targets the fork via `make rcu`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Official Isabelle release. Bump the version here to upgrade.
  ISABELLE_VERSION: Isabelle2025

jobs:
  isabelle-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Isabelle distribution
        id: cache-dist
        uses: actions/cache@v4
        with:
          path: ${{ env.ISABELLE_VERSION }}
          key: dist-${{ env.ISABELLE_VERSION }}-${{ runner.os }}

      - name: Download official Isabelle
        if: steps.cache-dist.outputs.cache-hit != 'true'
        run: |
          # Per-release archived URL (stable). Current release also at
          #   https://isabelle.in.tum.de/dist/${ISABELLE_VERSION}_linux.tar.gz
          url="https://isabelle.in.tum.de/website-${ISABELLE_VERSION}/dist/${ISABELLE_VERSION}_linux.tar.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o isabelle.tar.gz
          tar xzf isabelle.tar.gz
          rm isabelle.tar.gz

      - name: Put Isabelle on PATH
        run: echo "${GITHUB_WORKSPACE}/${ISABELLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show prover version
        run: isabelle version

      - name: Cache Isabelle heaps (HOL, HOL-Library, sessions)
        uses: actions/cache@v4
        with:
          path: ~/.isabelle
          # ROOT/source hash for freshness; restore-keys reuses the prior heaps
          # (HOL + HOL-Library) so only changed sessions rebuild.
          key: heaps-${{ env.ISABELLE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/ROOT', '**/*.thy') }}
          restore-keys: |
            heaps-${{ env.ISABELLE_VERSION }}-${{ runner.os }}-

      - name: Build the stack (strict zero-sorry gate on mature layers; q&d compile-check of the spine)
        run: make ci
